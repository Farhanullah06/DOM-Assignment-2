<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script async src="script.js"></script>
</head>
<body>
    <!-- Task 1: Select Element by ID Start -->
     <h1 id="heading">Welcome Heading</h1>
    <!-- Task 1: Select Element by ID End -->

    <!-- Task 2: Select Elements by Tag Name Start -->
     <p>Lorem Text Paragraph Number 1</p>
     <p>Lorem Text Paragraph Number 2</p>
     <p>Lorem Text Paragraph Number 3</p>
    <!-- Task 2: Select Elements by Tag Name End -->

    <!-- Task 3: Select Elements by Class Name Start -->
     <button class="sameBtn">Button 1</button>
     <button class="sameBtn">Button 2</button>
    <!-- Task 3: Select Elements by Class Name End -->

    <!-- Task 4: Use querySelector Start -->
     <h2 id="head2">Heading For the Query Selector</h2>
     <p id="para2">Paragraph For the Query Selector</p>
    <!-- Task 4: Use querySelector End -->

    <!-- Task 5: Use querySelectorAll Start -->
     <ul>
        <li>list Item 1</li>
        <li>list Item 2</li>
        <li>list Item 3</li>
        <li>list Item 4</li>
     </ul>
    <!-- Task 5: Use querySelectorAll End -->

    <!-- Task 6: Change Style Using Selected Element Start -->
     <p class="tasksixPara">Lorem Paragraph</p>
    <!-- Task 6: Change Style Using Selected Element End -->
</body>
</html>
